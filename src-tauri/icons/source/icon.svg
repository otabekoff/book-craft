<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Book Craft app icon. Regenerate every size with: bun run icons -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f78bd"/>
      <stop offset="1" stop-color="#1c3a63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3efe6"/>
      <stop offset="1" stop-color="#fdfcf8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e4d8"/>
      <stop offset="0.12" stop-color="#fbfaf5"/>
      <stop offset="1" stop-color="#f4f0e7"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a5d"/>
      <stop offset="1" stop-color="#d9583a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#tile)"/>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#shine)"/>
  <rect x="49.5" y="49.5" width="925" height="925" rx="214.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Book shadow -->
  <ellipse cx="512" cy="776" rx="300" ry="34" fill="#0b1830" opacity="0.45" filter="url(#soft)"/>

  <!-- Cover edge behind the pages -->
  <path d="M188 318 Q350 282 512 330 Q674 282 836 318 L836 752 Q674 718 512 768 Q350 718 188 752 Z" fill="#14294a"/>

  <!-- Left page -->
  <path d="M208 300 Q360 262 512 318 L512 746 Q360 696 208 730 Z" fill="url(#pageL)"/>
  <!-- Right page -->
  <path d="M512 318 Q664 262 816 300 L816 730 Q664 696 512 746 Z" fill="url(#pageR)"/>
  <!-- Spine shading -->
  <path d="M500 314 Q512 324 524 314 L524 742 Q512 752 500 742 Z" fill="#d6ccb7" opacity="0.55"/>

  <!-- Text lines -->
  <g fill="none" stroke="#9fb3cc" stroke-width="16" stroke-linecap="round">
    <path d="M262 384 Q352 364 446 392"/>
    <path d="M262 446 Q352 426 446 454"/>
    <path d="M262 508 Q352 488 446 516"/>
    <path d="M262 570 Q340 552 410 574"/>
  </g>
  <g fill="none" stroke="#9fb3cc" stroke-width="16" stroke-linecap="round" opacity="0.85">
    <path d="M578 508 Q672 482 762 496"/>
    <path d="M578 570 Q672 544 762 558"/>
    <path d="M578 632 Q650 612 716 620"/>
  </g>

  <!-- Bookmark ribbon -->
  <path d="M612 268 L700 268 L700 440 L656 404 L612 440 Z" fill="url(#ribbon)"/>
  <path d="M612 268 L700 268 L700 290 L612 290 Z" fill="#b8452c" opacity="0.5"/>

  <!-- Spark -->
  <path d="M790 150 Q802 214 862 226 Q802 238 790 302 Q778 238 718 226 Q778 214 790 150 Z" fill="#f7c95c"/>
  <circle cx="872" cy="318" r="16" fill="#f7c95c" opacity="0.85"/>
</svg>
