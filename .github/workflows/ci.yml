name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check the studio UI
        run: bun run check

      # The studio bundles the reader template, fonts, KaTeX and Mermaid; build them first.
      - name: Prepare resources
        run: bun run prepare:resources

      - name: Rust tests
        run: cargo test --workspace

      - name: Build the studio UI
        run: bun run build
